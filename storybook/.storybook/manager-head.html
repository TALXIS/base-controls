<link rel="icon" type="image/png" href="logo.png" />
<style>
  /* the web font Fluent loads for the controls, so the UI around them reads the same */
  @font-face {
    font-family: "Segoe UI Web (West European)";
    src: local("Segoe UI"), url("https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/assets/fonts/segoeui-westeuropean/segoeui-regular.woff2") format("woff2"), url("https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/assets/fonts/segoeui-westeuropean/segoeui-regular.woff") format("woff");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Segoe UI Web (West European)";
    src: local("Segoe UI SemiBold"), url("https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/assets/fonts/segoeui-westeuropean/segoeui-semibold.woff2") format("woff2"), url("https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/assets/fonts/segoeui-westeuropean/segoeui-semibold.woff") format("woff");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Segoe UI Web (West European)";
    src: local("Segoe UI Bold"), url("https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/assets/fonts/segoeui-westeuropean/segoeui-bold.woff2") format("woff2"), url("https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/assets/fonts/segoeui-westeuropean/segoeui-bold.woff") format("woff");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  /* the selected page reads like Fluent's navigation: a subtle fill, not a solid block */
  .sidebar-item[data-selected="true"] {
    background: #edebe9 !important;
    color: #0078d4 !important;
    font-weight: 600;
  }

  /* the item's menu button carries the selection colour to mask the text under it */
  .sidebar-item[data-selected="true"] > button {
    background: #edebe9 !important;
    box-shadow: 0 0 5px 5px #edebe9 !important;
    color: #0078d4 !important;
  }

  .sidebar-item[data-selected="true"] svg {
    color: #0078d4 !important;
  }

  .sidebar-subheading {
    color: #605e5c;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
</style>
