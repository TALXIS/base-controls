<script>
  //paints the saved or system scheme before Storybook's scripts load
  (() => {
    const saved = /[?&]globals=[^&]*\btheme:(light|dark)\b/.exec(decodeURIComponent(location.search));
    document.documentElement.dataset.colorScheme = saved ? saved[1] : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  })();
</script>
